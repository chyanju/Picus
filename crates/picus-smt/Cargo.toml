[package]
name = "picus-smt"
publish = false
description = "SMT solver backends for Picus"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[features]
# Default is `native` only — pure-Rust in-tree FF solver, no
# external build chains. The cvc5 (~15-20 min vendored build) and z3
# (vendored build) backends are opt-in via `--features cvc5` /
# `--features z3` (combine as needed). Top-level crates (picus,
# picus-cli) forward these feature names verbatim.
default = ["native"]
native = []
cvc5 = ["dep:cvc5-ff"]
z3 = ["dep:z3"]

[dependencies]
picus-r1cs = { path = "../picus-r1cs" }
num-bigint = { workspace = true }
num-traits = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
inventory = { workspace = true }

# Solver backends
z3 = { version = "0.20", features = ["vendored"], optional = true }
cvc5-ff = { path = "../cvc5-ff", optional = true }
picus-solver = { path = "../picus-solver" }
picus-core = { path = "../picus-core" }

[dev-dependencies]
# Test-only: the R1CS two-copy lowering (`r1cs_to_uniqueness_query`) lives in
# picus-analysis, which depends on picus-smt. The *integration* tests
# (`tests/*.rs`, a separate crate that links a single picus-smt) use it to
# build a realistic PolyIR from an R1CS. Cargo permits the resulting cycle
# because it runs only through a dev-dependency (never the normal build graph).
# The lib's own *unit* tests do NOT use this (a dev-dep cycle would link a
# second copy of picus-smt for unit tests); they lower locally via
# `src/test_lowering.rs` instead.
picus-analysis = { path = "../picus-analysis" }
