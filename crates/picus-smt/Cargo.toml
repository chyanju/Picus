[package]
name = "picus-smt"
publish = false
description = "SMT solver backends for Picus"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[features]
# The pure-Rust in-tree FF solver is always compiled (no feature gate).
# The cvc5 (~15-20 min vendored build) and z3 (vendored build) backends
# are opt-in via `--features cvc5` / `--features z3` (combine as needed).
# Top-level crates (picus, picus-cli) forward these feature names verbatim.
cvc5 = ["dep:cvc5-ff"]
z3 = ["dep:z3"]

[dependencies]
num-bigint = { workspace = true }
num-traits = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
inventory = { workspace = true }

# Solver backends
z3 = { version = "0.20", features = ["vendored"], optional = true }
cvc5-ff = { path = "../cvc5-ff", optional = true }
picus-solver = { path = "../picus-solver" }
picus-core = { path = "../picus-core" }

[dev-dependencies]
# Enables the shared R1CS fixture builders (`picus_r1cs::testkit`) for the
# crate's unit tests.
picus-r1cs = { path = "../picus-r1cs", features = ["testkit"] }

# NOTE: no dev-dependency on picus-analysis. The integration tests that need
# the R1CS two-copy lowering (`picus_analysis::uniqueness::r1cs_to_uniqueness_query`)
# live in `picus-analysis/tests/` (which depends on picus-smt downward), so
# picus-smt has no back-edge and the crate layering stays acyclic. The lib's
# own unit tests lower locally via `src/test_lowering.rs`.

# The QF_UFFF differential harness drives cvc5 through the cvc5-ff bindings;
# it only builds (and runs) with the cvc5 feature, keeping the default gate
# free of the vendored cvc5 build.
[[test]]
name = "uf_cvc5_differential"
required-features = ["cvc5"]
