[package]
name = "picus-analysis"
publish = false
description = "DPVL algorithm and propagation lemmas for Picus"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[features]
# Forwards picus-smt's backend features. The native FF engine is always
# compiled; `cvc5` / `z3` are opt-in. Tests that need a specific backend
# enable the corresponding feature on this crate.
cvc5 = ["picus-smt/cvc5"]
z3 = ["picus-smt/z3"]

[dependencies]
picus-r1cs = { path = "../picus-r1cs" }
picus-smt = { path = "../picus-smt", default-features = false }
picus-core = { path = "../picus-core" }
num-bigint = { workspace = true }
num-traits = { workspace = true }
num-integer = { workspace = true }
log = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Enables the shared R1CS fixture builders (`picus_r1cs::testkit`) for the
# crate's unit and integration tests.
picus-r1cs = { path = "../picus-r1cs", features = ["testkit"] }
