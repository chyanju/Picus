[package]
name = "picus-solver"
publish = false
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
description = "Pure Rust finite field SMT solver for Picus"

[features]
# Exposes `picus_solver::testkit`, the shared name-keyed fixture DSL for
# this crate's own tests and benches. Off by default: no production
# surface grows unless a dev target opts in.
testkit = []

[dependencies]
num-bigint.workspace = true
num-traits.workspace = true
log.workspace = true
thiserror.workspace = true
toml.workspace = true
oorandom = "11.1"
picus-core = { path = "../picus-core" }
picus-metric-macros = { path = "../picus-metric-macros" }

[dev-dependencies]
# Self-dependency enabling `testkit` for every test/bench target.
picus-solver = { path = ".", features = ["testkit"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "solver_bench"
harness = false

[[bench]]
name = "cdclt_bench"
harness = false

[[bench]]
name = "smt2_bench"
harness = false
