name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The R1CS smoke suite needs the benchmark-circuit submodule; the CI
  # gate mirrors the local native gate, which opts out of it.
  PICUS_TEST_SKIP_SMOKE: "1"

jobs:
  native:
    name: build + test (native default-members)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup on the runner picks the version pinned in
      # rust-toolchain.toml automatically; no toolchain action needed.
      - uses: Swatinem/rust-cache@v2
      # Plain `cargo build` / `cargo test` compile only default-members:
      # the pure-Rust native solver. The cvc5 / z3 backend crates need
      # vendored solver build chains and stay explicit-opt-in
      # (`--features cvc5` / `z3`); they are not built here.
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Rustdoc (deny warnings)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
